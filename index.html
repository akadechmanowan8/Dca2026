<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Financial Plan · 2569</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1420;
    --card:#101E2E;
    --card2:#152840;
    --border:#1E3348;
    --text:#E8EEF5;
    --text-secondary:#8DA2B5;
    --gold:#E8B94D;
    --green:#2ECC8F;
    --red:#E15B4B;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Sarabun',sans-serif;min-height:100vh;padding-bottom:40px;}
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px 12px;}

  .eyebrow{font-family:'Kanit',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px;}
  h1.title{font-family:'Kanit',sans-serif;font-size:28px;font-weight:700;margin:0 0 8px;line-height:1.25;}
  .subtitle{font-size:14px;color:var(--text-secondary);line-height:1.6;margin:0 0 26px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .section-title{font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;margin:28px 0 12px 2px;display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .section-sub{font-family:'Sarabun',sans-serif;font-size:12px;color:var(--text-secondary);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:0.5px;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-bottom:6px;}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;letter-spacing:-0.3px;}
  .stat-value.debt{color:var(--red);}
  .stat-value.principal{color:var(--text);}
  .stat-value.goal{color:var(--gold);}
  .stat-value.income{color:var(--green);}

  .income-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0 16px;border-top:1px dashed var(--border);margin-top:2px;}
  .income-row .stat-label{margin-bottom:0;}

  .progress-outer{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--border);}
  .progress-inner{height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--green));transition:width 1.1s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;}
  .progress-inner::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);animation:shimmer 2.4s infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .progress-meta{display:flex;justify-content:space-between;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-secondary);}
  .progress-meta span.pct{color:var(--gold);font-weight:600;}

  .month-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
  .month-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .month-name{font-family:'Kanit',sans-serif;font-size:16px;font-weight:600;}
  .month-leftover{font-family:'JetBrains Mono',monospace;font-size:12px;}
  .month-leftover.pos{color:var(--green);}
  .month-leftover.neg{color:var(--red);}
  .month-sub-label{font-size:11px;color:var(--text-secondary);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:0.5px;}

  .row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;min-height:44px;}
  .row:last-child{border-bottom:none;}
  .row.debt-row{background:rgba(225,91,75,0.06);border-radius:10px;padding:12px 10px;margin-top:6px;border-bottom:none;}

  .checkbox{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;transition:all .18s ease;}
  .checkbox.checked{background:var(--green);border-color:var(--green);}
  .checkbox.checked svg{display:block;}
  .checkbox svg{display:none;width:13px;height:13px;stroke:#08130D;stroke-width:3;}
  .debt-row .checkbox.checked{background:var(--red);border-color:var(--red);}

  .row-main{flex:1;min-width:0;}
  .row-title{font-size:14.5px;font-weight:500;color:var(--text);}
  .row-title.done{color:var(--text-secondary);text-decoration:line-through;text-decoration-color:var(--border);}
  .row-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;}

  .amount-wrap{flex:0 0 auto;display:flex;align-items:center;gap:2px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .amount-wrap .cur{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-secondary);}
  .amount-input{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:600;background:transparent;border:none;outline:none;color:var(--text);width:76px;text-align:right;}
  .amount-input.out{color:var(--red);}
  .amount-input.invest{color:var(--green);}
  .amount-input.debt{color:var(--red);}

  .tag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:5px;margin-left:6px;font-weight:600;}
  .tag.invest{background:rgba(46,204,143,0.14);color:var(--green);}
  .tag.out{background:rgba(225,91,75,0.14);color:var(--red);}
  .tag.debt{background:rgba(225,91,75,0.2);color:var(--red);}

  .alloc-ref{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .alloc-ref label{font-size:12px;color:var(--text-secondary);}
  #allocRefMonth{font-family:'Sarabun',sans-serif;background:var(--card2);color:var(--gold);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;}

  .alloc-row{padding:12px 4px;border-bottom:1px solid var(--border);}
  .alloc-row:last-child{border-bottom:none;}
  .alloc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .alloc-ticker{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
  .alloc-amount{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-secondary);}
  .alloc-bar-row{display:flex;align-items:center;gap:10px;}
  .alloc-bar-outer{flex:1;height:6px;background:var(--card2);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .alloc-bar-inner{height:100%;background:linear-gradient(90deg,var(--gold),#f2d78a);border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1);}
  .pct-wrap{flex:0 0 auto;display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:5px 8px;}
  .pct-input{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;background:transparent;border:none;outline:none;color:var(--gold);width:32px;text-align:right;}
  .pct-sign{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-secondary);}

  .alloc-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-secondary);}
  .alloc-total.warn span.val{color:var(--red);}
  .alloc-total span.val{color:var(--gold);font-weight:600;}

  .footer{display:flex;align-items:center;justify-content:space-between;margin-top:30px;padding:0 4px;gap:10px;flex-wrap:wrap;}
  .save-status{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;}
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--text-secondary);}
  .save-status.saving .save-dot{background:var(--gold);animation:pulse 1s infinite;}
  .save-status.saved .save-dot{background:var(--green);}
  .save-status.offline .save-dot{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .reset-btn{font-family:'Sarabun',sans-serif;font-size:13px;color:var(--red);background:rgba(225,91,75,0.1);border:1px solid rgba(225,91,75,0.3);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500;min-height:40px;}
  .reset-btn:active{background:rgba(225,91,75,0.2);}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,11,17,0.72);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;backdrop-filter:blur(3px);}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:340px;width:100%;}
  .modal h3{font-family:'Kanit',sans-serif;font-size:17px;margin:0 0 10px;}
  .modal p{font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin:0 0 20px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
  #confirmNo{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  #confirmYes{background:var(--red);color:#fff;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>ล้างข้อมูลทั้งหมด?</h3>
    <p>เช็คลิสต์ จำนวนเงิน และเป้าหมายทั้งหมดจะถูกรีเซ็ตกลับเป็นค่าเริ่มต้น การกระทำนี้ไม่สามารถย้อนกลับได้</p>
    <div class="modal-actions">
      <button id="confirmNo">ยกเลิก</button>
      <button id="confirmYes">ล้างข้อมูล</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAi24V9yY3dBjjj6ZPVAharA8f5UI5fato",
  authDomain: "plana-dca.firebaseapp.com",
  databaseURL: "https://plana-dca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "plana-dca",
  storageBucket: "plana-dca.firebasestorage.app",
  messagingSenderId: "816675523137",
  appId: "1:816675523137:web:15c833066749b3f65b54c0"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const stateRef = ref(db, 'state');
let isLocalWrite = false; // guards against re-rendering our own write as an incoming remote update
let isDirty = false; // true from the moment of a local edit until Firebase confirms the write succeeded

function monthItems(id){
  return [
    {id:id+'-rent', label:'ค่าห้อง', cyclePos:1, amount:2000, type:'out', paid:false},
    {id:id+'-net1', label:'ค่าเน็ต', cyclePos:1, amount:430, type:'out', paid:false},
    {id:id+'-ins', label:'ประกันรถ', cyclePos:1, amount:300, type:'out', paid:false},
    {id:id+'-dca1', label:'DCA เข้าพอร์ต', cyclePos:1, amount:2500, type:'invest', paid:false},
    {id:id+'-mom', label:'ฝากให้แม่', cyclePos:2, amount:4000, type:'out', paid:false},
    {id:id+'-net2', label:'ค่าเน็ต', cyclePos:2, amount:300, type:'out', paid:false},
    {id:id+'-dca2', label:'DCA เข้าพอร์ต', cyclePos:2, amount:4500, type:'invest', paid:false},
  ];
}

function defaultState(){
  const monthDefs = [
    {id:'sep', name:'กันยายน 2569', debtLabel:'งวดที่ 1', debtDue:'จ่ายไม่เกิน 5 ก.ย. 69', debtAmount:950.00},
    {id:'oct', name:'ตุลาคม 2569', debtLabel:'งวดที่ 2', debtDue:'จ่ายไม่เกิน 5 ต.ค. 69', debtAmount:499.38},
    {id:'nov', name:'พฤศจิกายน 2569', debtLabel:'งวดที่ 3', debtDue:'จ่ายไม่เกิน 5 พ.ย. 69', debtAmount:499.38},
    {id:'dec', name:'ธันวาคม 2569', debtLabel:'งวดที่ 4', debtDue:'จ่ายไม่เกิน 5 ธ.ค. 69', debtAmount:499.38},
    {id:'jan', name:'มกราคม 2570', debtLabel:'งวดที่ 5 (งวดสุดท้าย)', debtDue:'จ่ายไม่เกิน 5 ม.ค. 70', debtAmount:494.08},
  ];
  return {
    principal: 15026.46,
    goal: 46000,
    incomePerCycle: 8000,
    allocRefMonth: 'sep',
    months: monthDefs.map(m => ({
      id:m.id, name:m.name,
      items: monthItems(m.id),
      debt: {id:m.id+'-debt', label:m.debtLabel, due:m.debtDue, amount:m.debtAmount, paid:false}
    })),
    allocation: [
      {id:'a1', ticker:'SCHD', group:'ETF+', pct:25},
      {id:'a2', ticker:'VXUS', group:'ETF+', pct:25},
      {id:'a3', ticker:'MSFT', group:'หุ้นสหรัฐฯ', pct:10},
      {id:'a4', ticker:'NVDA', group:'หุ้นสหรัฐฯ', pct:10},
      {id:'a5', ticker:'GOOGL', group:'หุ้นสหรัฐฯ', pct:10},
      {id:'a6', ticker:'AAPL', group:'หุ้นสหรัฐฯ', pct:10},
      {id:'a7', ticker:'TSM', group:'หุ้นสหรัฐฯ', pct:10},
    ]
  };
}

let state = defaultState();
let saveTimer = null;

function fmtBaht(n){ return Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function checkboxSvg(){ return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

function findMonth(id){ return state.months.find(m=>m.id===id); }

function render(){
  const debtRemaining = state.months.filter(m=>!m.debt.paid).reduce((s,m)=>s+m.debt.amount,0);
  const progressPct = state.goal > 0 ? Math.min(100,(state.principal/state.goal)*100) : 0;
  const allocTotalPct = state.allocation.reduce((s,a)=>s+a.pct,0);

  const refMonth = findMonth(state.allocRefMonth) || state.months[0];
  const totalInvestRef = refMonth.items.filter(i=>i.type==='invest').reduce((s,i)=>s+i.amount,0);

  const monthCards = state.months.map(m => {
    const totalOut = m.items.filter(i=>i.type==='out').reduce((s,i)=>s+i.amount,0)
                   + m.items.filter(i=>i.type==='invest').reduce((s,i)=>s+i.amount,0)
                   + (m.debt.paid?0:m.debt.amount);
    const leftover = (state.incomePerCycle*2) - totalOut;
    const cyc1 = m.items.filter(i=>i.cyclePos===1);
    const cyc2 = m.items.filter(i=>i.cyclePos===2);
    const rowHtml = (item) => `
      <div class="row" data-row-month="${m.id}" data-row-id="${item.id}">
        <div class="checkbox ${item.paid?'checked':''}">${checkboxSvg()}</div>
        <div class="row-main">
          <div class="row-title ${item.paid?'done':''}">${item.label} <span class="tag ${item.type}">${item.type==='invest'?'ลงทุน':'จ่ายออก'}</span></div>
        </div>
        <div class="amount-wrap">
          <span class="cur">฿</span>
          <input class="amount-input ${item.type}" data-month="${m.id}" data-id="${item.id}" data-field="amount" inputmode="decimal" value="${fmtBaht(item.amount)}">
        </div>
      </div>`;
    return `
      <div class="month-card">
        <div class="month-head">
          <div class="month-name">${m.name}</div>
          <div class="month-leftover ${leftover>=0?'pos':'neg'}">เหลือสุทธิ ~ ฿${fmtBaht(leftover)}</div>
        </div>
        <div class="month-sub-label">รอบวันที่ 1–2</div>
        ${cyc1.map(rowHtml).join('')}
        <div class="month-sub-label">รอบวันที่ 16–17</div>
        ${cyc2.map(rowHtml).join('')}
        <div class="row debt-row" data-row-month="${m.id}" data-row-id="${m.debt.id}" data-is-debt="1">
          <div class="checkbox ${m.debt.paid?'checked':''}">${checkboxSvg()}</div>
          <div class="row-main">
            <div class="row-title ${m.debt.paid?'done':''}">${m.debt.label} <span class="tag debt">หนี้</span></div>
            <div class="row-desc">${m.debt.due}</div>
          </div>
          <div class="amount-wrap">
            <span class="cur">฿</span>
            <input class="amount-input debt" data-month="${m.id}" data-id="${m.debt.id}" data-field="amount" data-debt="1" inputmode="decimal" value="${fmtBaht(m.debt.amount)}">
          </div>
        </div>
      </div>`;
  }).join('');

  const allocGroups = [...new Set(state.allocation.map(a=>a.group))];
  const allocRows = allocGroups.map(g => `
    <div class="section-sub">${g}</div>
    ${state.allocation.filter(a=>a.group===g).map(a => {
      const amt = totalInvestRef * (a.pct/100);
      return `
      <div class="alloc-row">
        <div class="alloc-top">
          <div><span class="alloc-ticker">${a.ticker}</span></div>
          <div class="alloc-amount">฿${fmtBaht(amt)} / เดือน</div>
        </div>
        <div class="alloc-bar-row">
          <div class="alloc-bar-outer"><div class="alloc-bar-inner" style="width:${Math.min(100,a.pct*2)}%"></div></div>
          <div class="pct-wrap">
            <input class="pct-input" data-group="allocation" data-id="${a.id}" data-field="pct" inputmode="decimal" value="${a.pct}">
            <span class="pct-sign">%</span>
          </div>
        </div>
      </div>`;
    }).join('')}
  `).join('');

  const monthOptions = state.months.map(m => `<option value="${m.id}" ${m.id===state.allocRefMonth?'selected':''}>${m.name}</option>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="eyebrow">Financial Plan · 2569</div>
    <h1 class="title">แผนการเงินและการลงทุน</h1>
    <p class="subtitle">ติดตามหนี้คงเหลือ แผนเติมเงิน DCA และการจัดสรรพอร์ต แยกดูเป็นรายเดือนได้ แก้ตัวเลขได้ทันที</p>

    <div class="card">
      <div class="stats">
        <div><div class="stat-label">หนี้สินคงเหลือ</div><div class="stat-value debt">฿${fmtBaht(debtRemaining)}</div></div>
        <div><div class="stat-label">เงินต้นสะสม</div><div class="stat-value principal">
          <input class="amount-input" style="width:88px;padding:0;background:transparent;border:none;color:var(--text);font-size:15px;font-weight:600;text-align:left;" data-group="meta" data-id="principal" data-field="principal" inputmode="decimal" value="${fmtBaht(state.principal)}">
        </div></div>
        <div><div class="stat-label">เป้าหมาย</div><div class="stat-value goal">
          <input class="amount-input" style="width:88px;padding:0;background:transparent;border:none;color:var(--gold);font-size:15px;font-weight:600;text-align:left;" data-group="meta" data-id="goal" data-field="goal" inputmode="decimal" value="${fmtBaht(state.goal)}">
        </div></div>
      </div>
      <div class="income-row">
        <div class="stat-label">รายรับต่อรอบ (2 รอบ/เดือน)</div>
        <div class="amount-wrap"><span class="cur">฿</span>
          <input class="amount-input income" style="color:var(--green);" data-group="meta" data-id="incomePerCycle" data-field="incomePerCycle" inputmode="decimal" value="${fmtBaht(state.incomePerCycle)}">
        </div>
      </div>
      <div class="progress-outer"><div class="progress-inner" id="progressBar" style="width:0%"></div></div>
      <div class="progress-meta"><span>ความคืบหน้าสู่เป้าหมาย</span><span class="pct" id="progressPct">${progressPct.toFixed(1)}%</span></div>
    </div>

    <div class="section-title"><span class="dot"></span>ปฏิทินรายเดือน (ก.ย. 69 – ม.ค. 70)</div>
    ${monthCards}

    <div class="section-title"><span class="dot"></span>การจัดสรรพอร์ต</div>
    <div class="card">
      <div class="alloc-ref">
        <label>คำนวณจากยอด DCA เดือน</label>
        <select id="allocRefMonth">${monthOptions}</select>
      </div>
      ${allocRows}
      <div class="alloc-total ${allocTotalPct!==100?'warn':''}">
        <span>สัดส่วนรวม</span>
        <span class="val">${allocTotalPct}% ${allocTotalPct!==100?'⚠︎ ไม่เท่ากับ 100%':''}</span>
      </div>
    </div>

    <div class="footer">
      <div class="save-status" id="saveStatus"><div class="save-dot"></div><span id="saveStatusText">บันทึกแล้ว</span></div>
      <button class="reset-btn" id="resetBtn">ล้างเช็คลิสต์ + ตัวเลขทั้งหมด</button>
    </div>
  `;

  requestAnimationFrame(()=>{
    const bar = document.getElementById('progressBar');
    if(bar) bar.style.width = progressPct + '%';
  });
}

function updateField(scope, monthId, id, field, val){
  if(scope==='meta'){ state[field] = val; return; }
  if(scope==='allocation'){
    const item = state.allocation.find(i=>i.id===id);
    if(item) item[field] = val;
    return;
  }
  if(scope==='month'){
    const m = findMonth(monthId);
    if(!m) return;
    if(m.debt.id === id){ m.debt[field] = val; return; }
    const item = m.items.find(i=>i.id===id);
    if(item) item[field] = val;
  }
}

function togglePaid(monthId, id){
  const m = findMonth(monthId);
  if(!m) return;
  if(m.debt.id === id){ m.debt.paid = !m.debt.paid; }
  else{
    const item = m.items.find(i=>i.id===id);
    if(item) item.paid = !item.paid;
  }
  render();
  scheduleSave();
}

function setSaveStatus(status){
  const el = document.getElementById('saveStatus');
  const text = document.getElementById('saveStatusText');
  if(!el) return;
  el.className = 'save-status ' + status;
  text.textContent = status==='saving' ? 'กำลังบันทึก...' : status==='offline' ? 'ออฟไลน์ (ยังไม่ได้บันทึก)' : 'บันทึกแล้ว';
}

function scheduleSave(){
  isDirty = true; // block incoming sync from overwriting this edit until it's confirmed saved
  setSaveStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    isLocalWrite = true;
    set(stateRef, state)
      .then(()=>{
        isDirty = false; // write confirmed — safe to accept incoming sync again
        setSaveStatus('saved');
      })
      .catch(e=>{
        console.error('Save failed', e);
        isLocalWrite = false;
        // isDirty stays true on purpose: keep protecting this unsaved edit from being
        // clobbered by a stale remote value until a retry succeeds.
        setSaveStatus('offline');
      });
  }, 500);
}

function retrySaveIfNeeded(){
  if(!isDirty) return; // nothing unsaved
  isLocalWrite = true;
  set(stateRef, state)
    .then(()=>{ isDirty = false; setSaveStatus('saved'); })
    .catch(e=>{
      console.error('Retry save failed', e);
      isLocalWrite = false;
      setSaveStatus('offline');
    });
}

function loadState(){
  render(); // show default plan immediately, before Firebase responds

  onValue(stateRef, (snapshot)=>{
    if(isLocalWrite){ isLocalWrite = false; return; } // echo of our own write
    if(isDirty){ return; } // we have an unsaved local edit in flight — never let a stale remote value clobber it

    const val = snapshot.val();
    if(val && val.months && val.allocation){
      state = val;
      render();
    } else {
      // Nothing saved yet on this Firebase project — seed it with the default plan.
      isLocalWrite = true;
      set(stateRef, state).catch(e=>{
        console.error('Initial seed failed', e);
        isLocalWrite = false;
      });
    }
    setSaveStatus('saved');
  }, (error)=>{
    console.error('Firebase read failed', error);
    setSaveStatus('offline');
  });
}

function showModal(){ document.getElementById('modalOverlay').classList.add('show'); }
function hideModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

function resetAll(){
  state = defaultState();
  render();
  setSaveStatus('saving');
  isDirty = true;
  isLocalWrite = true;
  set(stateRef, state)
    .then(()=>{ isDirty = false; setSaveStatus('saved'); })
    .catch(e=>{
      console.error('Reset failed', e);
      isLocalWrite = false;
      setSaveStatus('offline');
    });
}

document.addEventListener('click', (e)=>{
  if(e.target.closest('input') || e.target.closest('select')) return;
  const row = e.target.closest('.row');
  if(row){ togglePaid(row.dataset.rowMonth, row.dataset.rowId); return; }
  if(e.target.closest('#resetBtn')){ showModal(); return; }
  if(e.target.closest('#confirmYes')){ hideModal(); resetAll(); return; }
  if(e.target.closest('#confirmNo')){ hideModal(); return; }
  if(e.target.id === 'modalOverlay'){ hideModal(); return; }
});

document.addEventListener('change', (e)=>{
  if(e.target.id === 'allocRefMonth'){
    state.allocRefMonth = e.target.value;
    render();
    scheduleSave();
  }
});

document.addEventListener('focus', (e)=>{
  if(e.target.matches('.amount-input, .pct-input')){ e.target.select(); }
}, true);

document.addEventListener('blur', (e)=>{
  const el = e.target;
  if(!el.matches) return;
  if(el.matches('.amount-input') || el.matches('.pct-input')){
    const scope = el.dataset.group === 'allocation' ? 'allocation' : el.dataset.group === 'meta' ? 'meta' : 'month';
    const monthId = el.dataset.month;
    const id = el.dataset.id;
    const field = el.dataset.field;
    let raw = el.value.replace(/,/g,'').trim();
    let val = parseFloat(raw);
    if(isNaN(val) || val < 0) val = 0;
    updateField(scope, monthId, id, field, val);
    render();
    scheduleSave();
  }
}, true);

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && e.target.matches('.amount-input, .pct-input')){ e.target.blur(); }
});

window.addEventListener('online', ()=> retrySaveIfNeeded());
window.addEventListener('offline', ()=> setSaveStatus('offline'));

window.addEventListener('beforeunload', (e)=>{
  if(isDirty){
    e.preventDefault();
    e.returnValue = '';
  }
});

loadState();
</script>
</body>
</html>
